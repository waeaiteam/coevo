[package]
name = "coevo-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
coevo-core.workspace = true
coevo-models.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
tracing.workspace = true
keyring-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
keyring-core = { workspace = true, features = ["sample"] }
