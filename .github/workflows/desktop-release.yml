name: coevo desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to, for example desktop-v1.0.0-alpha.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backend checks
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace -- --nocapture
          cargo test --test acceptance -- --nocapture

      - name: Desktop checks
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check:tauri
          npm run build
          npm test

      - name: Synthetic smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p coevo-server
          env COEVO_AUTH_TOKEN=release-preflight-token ./target/debug/coevo-server >/tmp/coevo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8717/health; then
              COEVO_AUTH_TOKEN=release-preflight-token COEVO_OPC_ID=opc-synthetic python scripts/synthetic_opc_user_test.py
              exit 0
            fi
            sleep 2
          done
          cat /tmp/coevo-server.log
          exit 1

  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run build:tauri

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundleRoots = @(
            ".artifacts/cargo-target/release/bundle",
            "apps/desktop/src-tauri/target/release/bundle",
            "target/release/bundle",
            "C:/ct/release/bundle"
          ) | Where-Object { Test-Path $_ }

          if (!$bundleRoots -or $bundleRoots.Count -eq 0) {
            Write-Error "Tauri bundle directory not found in known target locations."
          }

          $files = $bundleRoots | ForEach-Object {
            Write-Host "Scanning bundle directory: $_"
            Get-ChildItem $_ -Recurse -File
          } |
            Where-Object { $_.Extension -in ".msi", ".exe", ".msix", ".zip" }

          if (!$files -or $files.Count -eq 0) {
            Write-Error "No installer artifacts found under: $($bundleRoots -join ', ')"
          }

          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path "artifacts" $file.Name)
            Write-Host "Collected $($file.FullName)"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coevo-desktop-windows
          path: artifacts/*
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build macOS DMG
        working-directory: apps/desktop
        run: npm run build:tauri

      - name: Collect DMG artifacts
        shell: pwsh
        env:
          COEVO_ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundleRoots = @(
            ".artifacts/cargo-target/release/bundle",
            "apps/desktop/src-tauri/target/release/bundle",
            "target/release/bundle"
          ) | Where-Object { Test-Path $_ }

          if (!$bundleRoots -or $bundleRoots.Count -eq 0) {
            Write-Error "Tauri bundle directory not found in known target locations."
          }

          $files = $bundleRoots | ForEach-Object {
            Write-Host "Scanning bundle directory: $_"
            Get-ChildItem $_ -Recurse -File
          } |
            Where-Object { $_.Extension -eq ".dmg" }

          if (!$files -or $files.Count -eq 0) {
            Write-Error "No DMG artifacts found under: $($bundleRoots -join ', ')"
          }

          foreach ($file in $files) {
            $destName = "{0}-{1}{2}" -f $file.BaseName, $env:COEVO_ARCH, $file.Extension
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path "artifacts" $destName)
            Write-Host "Collected $($file.FullName) -> $destName"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coevo-desktop-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows-installer, macos-dmg]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare upload directory and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "upload/$(basename "$file")"
          done
          cd upload
          sha256sum * | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" upload/* \
              --repo "${{ github.repository }}" \
              --title "coevo desktop $RELEASE_TAG" \
              --notes "Desktop release artifacts built from $RELEASE_TAG (checked out at $(git rev-parse --short HEAD)). SHA256SUMS is included for artifact verification." \
              --prerelease
          else
            gh release upload "$RELEASE_TAG" upload/* \
              --repo "${{ github.repository }}" \
              --clobber
          fi