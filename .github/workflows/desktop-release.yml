name: coevo desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to, for example desktop-v1.0.0-alpha.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run build:tauri

      - name: Collect installer artifacts
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundleRoots = @(
            ".artifacts/cargo-target/release/bundle",
            "apps/desktop/src-tauri/target/release/bundle",
            "target/release/bundle",
            "C:/ct/release/bundle"
          ) | Where-Object { Test-Path $_ }

          if (!$bundleRoots -or $bundleRoots.Count -eq 0) {
            Write-Error "Tauri bundle directory not found in known target locations."
          }

          $files = $bundleRoots | ForEach-Object {
            Write-Host "Scanning bundle directory: $_"
            Get-ChildItem $_ -Recurse -File
          } |
            Where-Object { $_.Extension -in ".msi", ".exe", ".msix", ".zip" }

          if (!$files -or $files.Count -eq 0) {
            Write-Error "No installer artifacts found under: $($bundleRoots -join ', ')"
          }

          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path "artifacts" $file.Name)
            Write-Host "Collected $($file.FullName)"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coevo-desktop-windows
          path: artifacts/*
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" artifacts/* `
              --repo "${{ github.repository }}" `
              --title "coevo desktop $env:RELEASE_TAG" `
              --notes "Windows desktop installer built from $env:RELEASE_TAG (checked out at $(git rev-parse --short HEAD))." `
              --prerelease
          } else {
            gh release upload "$env:RELEASE_TAG" artifacts/* `
              --repo "${{ github.repository }}" `
              --clobber
          }

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build macOS DMG
        working-directory: apps/desktop
        run: npm run build:tauri

      - name: Collect DMG artifacts
        shell: pwsh
        env:
          COEVO_ARCH: ${{ matrix.arch }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundleRoots = @(
            ".artifacts/cargo-target/release/bundle",
            "apps/desktop/src-tauri/target/release/bundle",
            "target/release/bundle"
          ) | Where-Object { Test-Path $_ }

          if (!$bundleRoots -or $bundleRoots.Count -eq 0) {
            Write-Error "Tauri bundle directory not found in known target locations."
          }

          $files = $bundleRoots | ForEach-Object {
            Write-Host "Scanning bundle directory: $_"
            Get-ChildItem $_ -Recurse -File
          } |
            Where-Object { $_.Extension -eq ".dmg" }

          if (!$files -or $files.Count -eq 0) {
            Write-Error "No DMG artifacts found under: $($bundleRoots -join ', ')"
          }

          foreach ($file in $files) {
            $destName = "{0}-{1}{2}" -f $file.BaseName, $env:COEVO_ARCH, $file.Extension
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path "artifacts" $destName)
            Write-Host "Collected $($file.FullName) -> $destName"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coevo-desktop-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" `
              --repo "${{ github.repository }}" `
              --title "coevo desktop $env:RELEASE_TAG" `
              --notes "Desktop release artifacts built from $env:RELEASE_TAG (checked out at $(git rev-parse --short HEAD))." `
              --prerelease 2>$null
          }
          gh release upload "$env:RELEASE_TAG" artifacts/* `
            --repo "${{ github.repository }}" `
            --clobber
