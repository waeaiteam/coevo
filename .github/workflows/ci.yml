name: coevo-opc CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: {toolchain: stable}
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace -- --nocapture
      - run: cargo test --test acceptance -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: {toolchain: stable}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd apps/desktop && npm ci && npm run check:tauri && npm run build && npm test

  synthetic:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with: {toolchain: stable}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: cargo build -p coevo-server
      - run: |
          nohup env COEVO_AUTH_TOKEN=ci-sidecar-token cargo run -p coevo-server >/tmp/coevo-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8717/health && exit 0
            sleep 2
          done
          cat /tmp/coevo-server.log
          exit 1
      - run: curl -fsS http://127.0.0.1:8717/health
      - run: cd apps/desktop && COEVO_AUTH_TOKEN=ci-sidecar-token COEVO_OPC_ID=opc-synthetic npm run test:synthetic-opc
